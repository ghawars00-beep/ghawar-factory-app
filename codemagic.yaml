workflows:
  android-apk:
    name: Ghawar Factory Android APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Get packages
        script: |
          flutter pub get

      - name: Create Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name ghawar_factory_app .
          fi

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
