workflows:
  android-apk:
    name: Ghawar Factory Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create Android platform
        script: |
          if [ ! -d "android" ]; then flutter create --platforms=android --project-name ghawar_factory_complete .; fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
