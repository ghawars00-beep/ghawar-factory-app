workflows:
  android-apk:
    name: Ghawar Factory Android APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Check Flutter
        script: |
          flutter --version

      - name: Verify main.dart
        script: |
          test -f lib/main.dart || { echo "ERROR: lib/main.dart not found"; exit 1; }

      - name: Create Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name ghawar_factory_app .
          fi

      - name: Get packages
        script: |
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze

      - name: Test
        script: |
          flutter test

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
